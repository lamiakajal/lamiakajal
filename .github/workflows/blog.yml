name: Update Blog Posts

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/generate_blog.py"
      - ".github/workflows/blog.yml"

permissions:
  contents: write

concurrency:
  group: blog
  cancel-in-progress: true

jobs:
  blog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate blog cards
        run: python .github/scripts/generate_blog.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ui-v3
          git diff --cached --quiet || git commit -m "chore: update blog cards"
          git pull --rebase origin main
          git push
